# Copy to .github/workflows/ci.yml once apps/ and packages/ exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Package boundaries
        # @prm/verify must not depend on any network client — this is what keeps
        # "verification does not require PRM" true.
        run: pnpm lint:boundaries
      - name: Unit tests
        run: pnpm test:unit

      # ── Project-specific gates. These are the checks that stop an innocuous
      #    refactor from retroactively invalidating every signature. ───────────
      - name: Crypto test vectors
        run: node spec/test-vectors/verify.mjs
      - name: Schema conformance
        run: node spec/test-vectors/validate-schemas.mjs
      - name: Deterministic generation
        run: node spec/test-vectors/check-reproducible.mjs
      - name: Offline verification (network disabled)
        run: pnpm --filter @prm/verify test:offline

      - name: Build web
        run: pnpm build:web
      - name: No key material in the client bundle
        run: pnpm check:bundle-secrets

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Vercel preview)
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for the Vercel preview
        id: preview
        uses: patrickedqvist/wait-for-vercel-preview@d7982701e6fcd3ae073bff929e408e004404d38d # v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Playwright
        run: pnpm exec playwright test
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          # Previews are protection-enabled; this bypasses it for automation only.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
