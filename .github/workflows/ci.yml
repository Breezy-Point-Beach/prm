# Main CI. Grows as packages land; every step here must pass today.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # The central product claim, executable. The offline suite sabotages fetch,
      # XMLHttpRequest, WebSocket, http.request and https.request before running, so
      # any network access from @prm/verify fails the build loudly.
      - name: Offline verification
        run: pnpm --filter @prm/verify test:offline

      # @prm/verify must never gain a network-capable dependency. Its whole value is
      # that a recipient can verify with prm.app deleted and its operator hostile.
      - name: '@prm/verify has no network dependencies'
        run: |
          deps=$(node -e "const p=require('./packages/verify/package.json');console.log(Object.keys(p.dependencies||{}).join(' '))")
          echo "declared dependencies: $deps"
          for d in $deps; do
            case "$d" in
              @prm/*) ;;
              *) echo "::error::@prm/verify declares a non-PRM dependency: $d"; exit 1 ;;
            esac
          done
          if grep -rnE "\bfetch\s*\(|from 'node:https?'|require\('https?'\)" packages/verify/src; then
            echo "::error title=Network access in @prm/verify::Verification must never contact the network."
            exit 1
          fi
          echo "OK: @prm/verify depends only on @prm/* and contains no network calls."

      # spec/schemas is the single source of truth. If the inlined copy in
      # @prm/schema has drifted from it, fail rather than ship two vocabularies.
      - name: Generated schemas are up to date
        run: |
          pnpm --filter @prm/schema generate
          if ! git diff --quiet -- packages/schema/src/generated; then
            echo "::error title=Generated schemas are stale::spec/schemas changed without regenerating."
            echo "Run: pnpm --filter @prm/schema generate && git add packages/schema/src/generated"
            git --no-pager diff --stat -- packages/schema/src/generated
            exit 1
          fi

      - name: Spec conformance
        run: pnpm spec:check
