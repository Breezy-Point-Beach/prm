# Guards the signature-breaking surface.
#
# Canonicalization, hashing, and document shape are load-bearing: a change to any
# of them retroactively invalidates every signature ever produced. This workflow
# makes that failure loud and explicit rather than silent.
#
# This is the ONLY live workflow today. Once apps/ and packages/ exist, copy
# docs/templates/ci.yml into place alongside it and widen the paths filter below.
name: Spec conformance

on:
  push:
    branches: [main]
    paths: ['spec/**', 'packages/schema/**', 'packages/crypto/**', 'packages/verify/**',
            'packages/ledger/**', 'package.json', 'pnpm-lock.yaml',
            '.github/workflows/spec-conformance.yml']
  # NO paths filter on pull_request, deliberately.
  #
  # This job is a REQUIRED status check. A required check whose workflow is path-filtered simply
  # never reports on an unrelated pull request, and GitHub blocks the merge waiting for a run that
  # will never happen. That silently blocked a PR that touched no spec files at all.
  #
  # The job takes about 25 seconds, and the digest guard inside it already decides for itself whether
  # anything relevant changed by diffing against the base. Running it always is both cheaper than the
  # confusion and more correct.
  pull_request:
  workflow_dispatch:

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Vectors, schemas, determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Re-derives every digest, signature, account id, commitment and Merkle
      # proof from the published documents alone. Shares no code with the
      # generator — if it ever imports from it, it has stopped being a test.
      - name: Crypto test vectors
        run: node spec/test-vectors/verify.mjs

      - name: Schema conformance
        run: node spec/test-vectors/validate-schemas.mjs

      # Catches accidental non-determinism (map ordering, Date.now(), locale
      # collation) before it can reach a signature.
      - name: Deterministic generation
        run: node spec/test-vectors/check-reproducible.mjs

      - name: Assert published digests are unchanged
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'spec-version-bump') &&
          !contains(github.event.pull_request.labels.*.name, 'vector-regeneration')
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --quiet "origin/${{ github.base_ref }}" -- \
                 spec/examples spec/test-vectors/vectors.json; then
            echo "::error title=Canonical digests changed::A committed example digest or test vector changed."
            echo ""
            echo "This invalidates every signature ever produced under the current spec version."
            echo "Two labels can acknowledge it, and they are NOT interchangeable:"
            echo ""
            echo "  vector-regeneration  Fixture data only. The schemas and the canonicalization"
            echo "                       rules are untouched; only the synthetic example values"
            echo "                       changed. CI additionally verifies spec/schemas is unchanged."
            echo ""
            echo "  spec-version-bump    A real protocol change (v1 -> v2):"
            echo "                         1. add new schemas alongside the existing ones"
            echo "                         2. keep the v1 vectors so old documents stay verifiable"
            echo "                         3. document the migration in docs/decisions.md"
            exit 1
          fi
          echo "Canonical digests unchanged."

      # A fixture regeneration must not smuggle in a protocol change. If the
      # vector-regeneration label is used, the schemas must be byte-identical.
      - name: Fixture regeneration must not change the protocol
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'vector-regeneration') &&
          !contains(github.event.pull_request.labels.*.name, 'spec-version-bump')
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --quiet "origin/${{ github.base_ref }}" -- spec/schemas; then
            echo "::error title=Protocol changed under a fixture label::spec/schemas was modified in a PR labelled vector-regeneration."
            echo "That label is only for changes to synthetic example VALUES. A schema change is a"
            echo "spec-version-bump and must follow that process instead."
            git --no-pager diff --stat "origin/${{ github.base_ref }}" -- spec/schemas
            exit 1
          fi
          echo "spec/schemas unchanged: this is a fixture regeneration, not a protocol change."

      # Adding a new document type is additive and safe. MODIFYING an existing schema changes what
      # already-signed documents validate against, and is a protocol change. Previously only the
      # example-digest guard covered spec/, so a pure schema edit with no example change slipped
      # through unguarded.
      - name: Existing schemas may not be modified without a version bump
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'spec-version-bump')
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          modified=$(git diff --name-only --diff-filter=M "origin/${{ github.base_ref }}" -- spec/schemas || true)
          if [ -n "$modified" ]; then
            echo "::error title=An existing schema was modified::$modified"
            echo ""
            echo "Adding a NEW schema file is additive and needs no label. Changing an existing one"
            echo "alters what already-signed documents validate against, which is a protocol change:"
            echo "  1. add the new version alongside, do not edit v1 in place"
            echo "  2. keep the v1 vectors so old documents stay verifiable"
            echo "  3. document the migration in docs/decisions.md"
            echo "  4. apply the 'spec-version-bump' label"
            exit 1
          fi
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}" -- spec/schemas || true)
          if [ -n "$added" ]; then
            echo "New schemas added (additive, allowed):"
            echo "$added"
          fi
          echo "No existing schema was modified."
